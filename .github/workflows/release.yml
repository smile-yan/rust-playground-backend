name: Release and Deploy

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux-x64:
    name: Build linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-unknown-linux-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-musl-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          BINARY="rust-playground-linux-x64"
          cp "target/x86_64-unknown-linux-musl/release/rust-playground" "dist/${BINARY}"
          cd dist
          sha256sum "${BINARY}" > "${BINARY}.sha256"
          echo "Original binary size: $(du -h "${BINARY}" | cut -f1)"
          START_TIME=$(date +%s)
          tar cJf "${BINARY}.tar.xz" "${BINARY}" "${BINARY}.sha256"
          END_TIME=$(date +%s)
          echo "Archive size: $(du -h "${BINARY}.tar.xz" | cut -f1)"
          echo "Compression time: $((END_TIME - START_TIME)) seconds"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-playground-linux-x64
          path: dist/*.tar.xz
          if-no-files-found: error

  build-cross:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: macos-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: macos-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BINARY="rust-playground-${{ matrix.arch }}.exe"
            ARCHIVE="rust-playground-${{ matrix.arch }}.zip"
            cp "target/${{ matrix.target }}/release/rust-playground.exe" "dist/${BINARY}"
            cd dist
            sha256sum "${BINARY}" > "${BINARY}.sha256"
            powershell -Command "Compress-Archive -Path '${BINARY}','${BINARY}.sha256' -DestinationPath '${ARCHIVE}' -Force"
          else
            BINARY="rust-playground-${{ matrix.arch }}"
            ARCHIVE="rust-playground-${{ matrix.arch }}.tar.xz"
            cp "target/${{ matrix.target }}/release/rust-playground" "dist/${BINARY}"
            cd dist
            sha256sum "${BINARY}" > "${BINARY}.sha256"
            tar cJf "${ARCHIVE}" "${BINARY}" "${BINARY}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-playground-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.zip
          if-no-files-found: error

  prepare:
    name: Prepare deploy matrix
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.set-matrix.outputs.indices }}
    steps:
      - name: Validate DEPLOY_SERVERS secret
        shell: bash
        run: |
          if [[ -z '${{ secrets.DEPLOY_SERVERS }}' ]]; then
            echo "::error::Missing required secret: DEPLOY_SERVERS. Please create it with a JSON matrix."
            exit 1
          fi

      - name: Parse deploy matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' > servers.json
          ${{ secrets.DEPLOY_SERVERS }}
          EOF
          echo "=== Server matrix ==="
          jq . servers.json
          count=$(jq '.include | length' servers.json)
          if [[ "$count" -le 0 ]]; then
            echo "::error::DEPLOY_SERVERS must be a JSON object with a non-empty 'include' array. Example: {\"include\":[{\"host\":\"1.2.3.4\",\"user\":\"deploy\"}]}"
            exit 1
          fi
          indices=$(jq -c "[range($count)]" servers.json)
          echo "indices=$indices" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to server ${{ matrix.index }}
    needs: [build-linux-x64, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.prepare.outputs.indices) }}
    steps:
      - name: Extract server config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' > servers.json
          ${{ secrets.DEPLOY_SERVERS }}
          EOF
          idx=${{ matrix.index }}
          host=$(jq -r ".include[$idx].host" servers.json)
          port=$(jq -r ".include[$idx].port // \"22\"" servers.json)
          user=$(jq -r ".include[$idx].user" servers.json)
          path=$(jq -r ".include[$idx].path // \"/opt/rust-playground\"" servers.json)
          if [[ -z "$host" || -z "$user" ]]; then
            echo "::error::Missing required fields in DEPLOY_SERVERS include[$idx] (host, user are required)"
            exit 1
          fi
          if [[ -z '${{ secrets.GLOBAL_PRIVATE_KEY }}' ]]; then
            echo "::error::Missing required secret: GLOBAL_PRIVATE_KEY. Please create it with the shared SSH private key used for all deployments."
            exit 1
          fi
          echo "SSH_HOST=$host" >> "$GITHUB_ENV"
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"
          echo "SSH_USER=$user" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=$path" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.GLOBAL_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key

      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-playground-linux-x64
          path: dist

      - name: Setup SSH key and test connectivity
        shell: bash
        run: |
          set -euo pipefail
          # SSH config and deploy_key are prepared in the previous step

          echo "=== SSH config ==="
          echo "Host: $SSH_HOST"
          echo "Port: $SSH_PORT"
          echo "User: $SSH_USER"
          echo "Deploy path: $DEPLOY_PATH"
          echo "Key file size: $(stat -c%s ~/.ssh/deploy_key 2>/dev/null || stat -f%z ~/.ssh/deploy_key 2>/dev/null) bytes"

          echo "=== Clean up stale host keys ==="
          ssh-keygen -f ~/.ssh/known_hosts -R "$SSH_HOST" 2>/dev/null || true
          ssh-keygen -f ~/.ssh/known_hosts -R "[$SSH_HOST]:$SSH_PORT" 2>/dev/null || true

          echo "=== Scanning host key ==="
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1 || true

          echo "=== Checking TCP reachability ==="
          if command -v nc >/dev/null 2>&1; then
            nc -vz -w 10 "$SSH_HOST" "$SSH_PORT" || true
          else
            timeout 10 bash -c "</dev/tcp/${SSH_HOST}/${SSH_PORT}" && echo "TCP port is reachable" || echo "TCP port is not reachable"
          fi

          echo "=== Testing SSH connection (verbose, with retries) ==="
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt/$max_attempts..."
            if ssh -v -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3 \
                -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
                "echo 'SSH connection OK'"; then
              echo "SSH connection succeeded on attempt $attempt"
              exit 0
            fi
            echo "SSH connection attempt $attempt failed"
            if [[ $attempt -lt $max_attempts ]]; then
              echo "Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "::error::SSH connection test failed after $max_attempts attempts for $SSH_HOST. Please verify host, port, user in the DEPLOY_SERVERS secret, ensure the GLOBAL_PRIVATE_KEY secret contains the correct shared SSH private key, and ensure the server is reachable from GitHub Actions runners."

          echo "=== Diagnosing port service ==="
          echo "TCP port is open, but SSH banner was not received. The configured port may not be an SSH service."
          echo "Raw response from host:port (5 second timeout):"
          timeout 5 bash -c "exec 3<>/dev/tcp/${SSH_HOST}/${SSH_PORT}; cat <&3" || true

          echo "=== Checking for HTTP/HTTPS response ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 5 "http://${SSH_HOST}:${SSH_PORT}/" || true
          curl -s -o /dev/null -w "HTTPS %{http_code}\n" --max-time 5 -k "https://${SSH_HOST}:${SSH_PORT}/" || true

          exit 1

      - name: Clean up known_hosts
        run: |
          ssh-keygen -f ~/.ssh/known_hosts -R "$SSH_HOST" 2>/dev/null || true
          ssh-keygen -f ~/.ssh/known_hosts -R "[$SSH_HOST]:$SSH_PORT" 2>/dev/null || true
          rm -f ~/.ssh/known_hosts2
        continue-on-error: true

      - name: Resolve server IP
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolving $SSH_HOST ..."
          # 如果 host 已经是 IP 地址，直接复用
          if [[ "$SSH_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IP="$SSH_HOST"
          else
            IP=$(dig +short "$SSH_HOST" 2>/dev/null | grep -E '^[0-9]+\.' | head -n1)
            if [[ -z "$IP" ]]; then
              IP=$(getent ahostsv4 "$SSH_HOST" 2>/dev/null | awk 'NR==1 {print $1}')
            fi
            if [[ -z "$IP" ]]; then
              IP=$(getent hosts "$SSH_HOST" 2>/dev/null | awk 'NR==1 {print $1}')
            fi
          fi
          if [[ -z "$IP" ]]; then
            echo "::error::Could not resolve $SSH_HOST to an IP address"
            exit 1
          fi
          echo "Resolved $SSH_HOST -> $IP"
          echo "SERVER_IP=$IP" >> "$GITHUB_OUTPUT"

      - name: Copy binary to cloud server
        shell: bash
        env:
          SERVER_IP: ${{ steps.resolve.outputs.SERVER_IP }}
        run: |
          set -euo pipefail
          COMMON_SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o LogLevel=ERROR"
          ARCHIVE="rust-playground-linux-x64.tar.xz"

          echo "=== Ensuring deploy directory exists on $SERVER_IP ==="
          ssh ${COMMON_SSH_OPTS} -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SERVER_IP" \
            "mkdir -p ${DEPLOY_PATH}" 2>&1 || {
              echo "mkdir failed, trying with sudo..."
              ssh ${COMMON_SSH_OPTS} -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SERVER_IP" \
                "sudo mkdir -p ${DEPLOY_PATH} && sudo chown \$(id -u):\$(id -g) ${DEPLOY_PATH}" 2>&1 || {
                  echo "::error::Cannot create ${DEPLOY_PATH}. Please ensure the directory exists and the SSH user has write permission, or change DEPLOY_PATH to a directory under the user's home."
                  exit 1
                }
            }

          echo "Archive size: $(du -h "dist/${ARCHIVE}" | cut -f1)"

          echo "=== Uploading compressed archive to $SERVER_IP ==="
          START_UPLOAD=$(date +%s)
          scp ${COMMON_SSH_OPTS} -P "$SSH_PORT" -i ~/.ssh/deploy_key "dist/${ARCHIVE}" "$SSH_USER@$SERVER_IP:${DEPLOY_PATH}/"
          END_UPLOAD=$(date +%s)
          echo "Upload time: $((END_UPLOAD - START_UPLOAD)) seconds"

          echo "=== Extracting archive and cleaning up on $SERVER_IP ==="
          START_EXTRACT=$(date +%s)
          ssh ${COMMON_SSH_OPTS} -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SERVER_IP" \
            "cd ${DEPLOY_PATH} && tar xJf ${ARCHIVE} && rm -f ${ARCHIVE} && ls -lh ${DEPLOY_PATH}"
          END_EXTRACT=$(date +%s)
          echo "Extract time: $((END_EXTRACT - START_EXTRACT)) seconds"

      - name: Start application on cloud server
        shell: bash
        env:
          SERVER_IP: ${{ steps.resolve.outputs.SERVER_IP }}
        run: |
          set -euo pipefail
          COMMON_SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o LogLevel=ERROR"
          timeout 120 ssh ${COMMON_SSH_OPTS} -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SERVER_IP" << EOF
          set -euo pipefail

          APP_DIR="$DEPLOY_PATH"
          cd "\${APP_DIR}"

          # Verify checksum before renaming
          if [ -f "rust-playground-linux-x64.sha256" ]; then
            sha256sum -c rust-playground-linux-x64.sha256
          fi

          # Rename binary to standard name
          mv rust-playground-linux-x64 rust-playground
          chmod +x rust-playground

          # Clean up checksum file
          rm -f rust-playground-linux-x64.sha256

          # Ensure Rust toolchain is available (required to compile user code)
          if ! command -v rustc &>/dev/null; then
            echo "Installing Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "\$HOME/.cargo/env" || true
          echo "Setting default Rust toolchain..."
          rustup default stable || true
          echo "Adding wasm32-wasip1 target..."
          rustup target add wasm32-wasip1 || true
          echo "Rust target check complete"

          # Stop any existing instance
          pkill -f "rust-playground" || true
          sleep 2

          # Ensure rustup environment is available for the binary
          if [ -f "\$HOME/.cargo/env" ]; then
            source "\$HOME/.cargo/env"
          fi

          # Start in a new session, fully detached from the SSH session
          setsid "\${APP_DIR}/rust-playground" > "\${APP_DIR}/rust-playground.log" 2>&1 < /dev/null &
          echo "Started rust-playground (PID: \$!)"

          # Show process status and recent log for diagnostics
          sleep 1
          ps -p \$! -o pid,ppid,cmd || true
          tail -n 20 "\${APP_DIR}/rust-playground.log" || true

          echo "Deployment completed"
          EOF

      - name: Print remote log on failure
        if: failure()
        shell: bash
        env:
          SERVER_IP: ${{ steps.resolve.outputs.SERVER_IP }}
        run: |
          COMMON_SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o LogLevel=ERROR"
          echo "=== Remote process status ==="
          ssh ${COMMON_SSH_OPTS} -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SERVER_IP" \
            "ps aux | grep -i rust-playground | grep -v grep || true" || true
          echo "=== Remote log tail ==="
          ssh ${COMMON_SSH_OPTS} -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SERVER_IP" \
            "tail -n 50 ${DEPLOY_PATH}/rust-playground.log 2>/dev/null || echo 'No log file found'" || true

      - name: Verify service is reachable
        shell: bash
        env:
          SERVER_IP: ${{ steps.resolve.outputs.SERVER_IP }}
        run: |
          set -euo pipefail
          url="http://$SERVER_IP:9001/ping"
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "Health check attempt $attempt/$max_attempts: $url"
            response=$(curl -s -m 15 -w "\nHTTP %{http_code}" "$url" || true)
            echo "$response"
            if echo "$response" | tail -n1 | grep -q "HTTP 200"; then
              echo "Service is reachable"
              exit 0
            fi
            echo "Service not reachable yet"
            if [[ $attempt -lt $max_attempts ]]; then
              echo "Waiting 20 seconds before next attempt..."
              sleep 20
            fi
          done
          echo "::error::Service did not become reachable after $max_attempts attempts"
          exit 1

  release:
    name: Create GitHub Release
    needs: [build-linux-x64, build-cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (latest)
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rust-playground-*
          merge-multiple: true

      - name: Verify artifacts with Node.js
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('dist');
            console.log('Artifacts to release:');
            files.forEach(f => {
              const stat = fs.statSync(path.join('dist', f));
              console.log(' - ' + f + ' (' + stat.size + ' bytes)');
            });
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
